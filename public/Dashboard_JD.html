<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JD — KPI Live Dashboard</title><style>:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#484f58;--up:#3fb950;--down:#f85149;}*{margin:0;padding:0;box-sizing:border-box;}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;min-height:100vh;}#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;}.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100;}.tabs-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;}.container{padding:26px 28px;}.tab-panel{display:none;}.tab-panel.active{display:block;}:root{--accent:#f43f5e;--accent2:#60a5fa;--accent3:#34d399;--accent4:#c084fc;}</style></head><body><div id="loading-screen"><div class="spinner"></div><div class="loading-text">Loading JD KPI data...</div></div><header><div class="brand"><div class="logo" style="background:linear-gradient(135deg,#9f1239,#e11d48)">JD</div><div><div class="brand-name">JD Performance</div></div></div></header><div class="tabs-bar"><button class="tab-btn active" onclick="switchTab('ov',this)">Overview</button><button class="tab-btn" onclick="switchTab('tr',this)">Traffic & Ads</button><button class="tab-btn" onclick="switchTab('rv',this)">Revenue & Orders</button></div><div id="ov" class="tab-panel active"><div class="container"><div id="bstrip"></div><div id="ov-cards"></div></div></div><div id="tr" class="tab-panel"><div class="container"><div id="tr-cards"></div></div></div><div id="rv" class="tab-panel"><div class="container"><div id="rv-cards"></div><table><tbody id="rv-tbl"></tbody></table></div></div><script>function switchTab(id,btn){document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});document.getElementById(id).classList.add('active');btn.classList.add('active');}</script></body></html>
